<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231877F2'/%3E%3Ctext x='8' y='12' font-size='10' text-anchor='middle' fill='white'%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      padding: 48px 40px;
      width: 380px;
      max-width: 100%;
      text-align: center;
    }

    .avatar {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #1877f2;
      color: #ffffff;
      font-size: 32px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 22px;
      color: #1c1e21;
      margin-bottom: 8px;
    }

    p {
      color: #65676b;
      margin-bottom: 28px;
      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #1877f2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #166fe5; }
  </style>
</head>
<body>

  <div class="card">
    <div class="avatar" id="avatar">?</div>
    <h1 id="welcome">Welcome</h1>
    <p id="subtitle">&nbsp;</p>
    <button id="logoutBtn">Sign out</button>
  </div>

  <script src="js/config.js"></script>
  <script>
    // Guard: no token -> back to the sign-in page.
    const token = localStorage.getItem('auth_token');
    if (!token) {
      window.location.href = 'index.html';
    }

    (async () => {
      try {
        const res = await fetch(API_BASE_URL + '/api/auth/me', {
          headers: { 'Authorization': 'Bearer ' + token },
        });

        if (!res.ok) throw new Error('Session expired');

        const user = await res.json();
        const name = user.username || user.email;
        const initial = (name || '?').charAt(0).toUpperCase();

        document.getElementById('welcome').textContent = 'Welcome, ' + name;
        document.getElementById('subtitle').textContent = 'Signed in as ' + user.email;
        document.getElementById('avatar').textContent = initial;
      } catch (err) {
        // Invalid/expired session -> back to sign in.
        localStorage.removeItem('auth_token');
        window.location.href = 'index.html';
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await fetch(API_BASE_URL + '/api/auth/logout', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
        });
      } catch (err) {
        // ignore network errors; clear the token locally regardless
      }
      localStorage.removeItem('auth_token');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
