<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My orders · Sandbox Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231877F2'/%3E%3Ctext x='16' y='24' font-size='20' text-anchor='middle' fill='white'%3E%F0%9F%9A%8A%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="toast" class="toast"></div>

<header class="top">
  <span class="brand">🛍️ Sandbox Shop</span>
  <a href="store.html" class="link">← Shop</a>
  <button class="link" id="authBtn">Sign out</button>
</header>

<section class="section">
  <div class="container">
    <h2>My orders</h2>
    <div id="orders"></div>
  </div>
</section>

<script src="js/api.js"></script>
<script>
requireAuth();
const $ = (id) => document.getElementById(id);
const money = (minor, cur = 'NGN') => new Intl.NumberFormat('en-NG', { style: 'currency', currency: cur }).format(minor / 100);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

async function loadOrders() {
  const { data } = await api('/api/store/orders');
  const container = $('orders');
  if (data.length === 0) {
    container.innerHTML = '<p class="mute">No orders yet.</p>';
    return;
  }
  container.innerHTML = data.map((o) => `<div class="card" style="margin-bottom:10px;">
    <div class="row">
      <div><b>${esc(o.id)}</b> <span class="mute">${esc(o.status.replace('_', ' '))}</span>
        <div class="mute">${esc(o.created_at)} · ${o.items.length} item${o.items.length !== 1 ? 's' : ''}</div></div>
      <div style="text-align:right"><b>${money(o.total_minor, o.currency)}</b></div>
    </div>
    <div style="display:flex;gap:10px;">
      ${o.items.map(it => `<div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:#f0f2f5;border-radius:6px;font-size:0.85rem;">
        <span style="font-weight:700;">${it.quantity}×</span> ${esc(it.name)}</div>`).join('')}
    </div>
  </div>`).join('');
}
loadOrders();

$('authBtn').textContent = token() ? 'Sign out' : 'Sign in';
$('authBtn').onclick = () => { if (token()) { localStorage.removeItem('auth_token'); toast('Signed out'); location.href = 'index.html'; } else { location.href = 'index.html'; } };
</script>

</body>
</html>
