<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — STILL</title>
  <meta name="description" content="Sign in to STILL — sandbox storefront.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
  <style>
    .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; }
    .auth-card {
      width: min(430px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      padding: 40px 36px 34px;
      box-shadow: 0 24px 60px -40px rgba(16, 18, 16, .45);
    }
    .auth-card .wordmark { font-size: 24px; }
    .auth-card h1 {
      margin: 22px 0 8px;
      font-family: var(--font-display);
      font-size: clamp(34px, 5vw, 44px);
      font-weight: 400;
      line-height: 1;
    }
    .auth-sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .auth-field { margin-bottom: 16px; }
    .auth-field label {
      display: block; margin-bottom: 7px;
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
    }
    .auth-field input {
      width: 100%; padding: 12px 13px;
      border: 1px solid var(--line-strong); background: var(--white);
      font-family: var(--font-body); font-size: 15px; color: var(--ink);
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    .auth-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
    .auth-error { min-height: 20px; margin: 2px 0 12px; color: var(--red); font-size: 13px; }
    .auth-submit {
      width: 100%; padding: 13px 18px; border: 1px solid var(--ink);
      background: var(--ink); color: var(--paper); cursor: pointer;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .16em; text-transform: uppercase;
      transition: background .15s, border-color .15s;
    }
    .auth-submit:hover { background: var(--blue); border-color: var(--blue); }
    .auth-submit:disabled { opacity: .6; cursor: progress; }
    .auth-back {
      display: inline-block; margin-top: 22px;
      font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .08em; color: var(--muted); text-decoration: none;
    }
    .auth-back:hover { color: var(--ink); }
    .auth-hint { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="wordmark" href="index.html">STILL<span class="wordmark__mark">®</span></a>

      <h1>Sign in</h1>
      <p class="auth-sub">Use your account to check out and see your orders.</p>

      <form id="signinForm" novalidate>
        <div class="auth-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <p id="formError" class="auth-error" role="alert"></p>
        <button id="submit" class="auth-submit" type="submit">Sign in</button>
      </form>

      <a class="auth-back" href="index.html">← Back to the shop</a>

      <p class="auth-hint">
        Demo accounts are listed in <code>README.md</code>.
      </p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/signin.js"></script>
</body>
</html>
